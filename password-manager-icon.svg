<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182530"/>
      <stop offset="100%" stop-color="#0F1820"/>
    </linearGradient>

    <radialGradient id="doorFace" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#F3CE86"/>
      <stop offset="55%" stop-color="#DDAE5C"/>
      <stop offset="100%" stop-color="#B5813A"/>
    </radialGradient>

    <linearGradient id="doorRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5F2A"/>
      <stop offset="100%" stop-color="#6B4A20"/>
    </linearGradient>

    <radialGradient id="hub" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5C3E1C"/>
      <stop offset="100%" stop-color="#3A2712"/>
    </radialGradient>

    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- soft top sheen -->
    <ellipse cx="256" cy="70" rx="320" ry="140" fill="#FFFFFF" opacity="0.035"/>

    <!-- vault door outer rim -->
    <circle cx="256" cy="266" r="160" fill="url(#doorRim)"/>
    <!-- vault door face -->
    <circle cx="256" cy="266" r="146" fill="url(#doorFace)"/>

    <!-- bolt studs around the rim -->
    <g fill="#7A5426" opacity="0.85">
      <circle cx="256" cy="122" r="9"/>
      <circle cx="256" cy="410" r="9"/>
      <circle cx="112" cy="266" r="9"/>
      <circle cx="400" cy="266" r="9"/>
      <circle cx="154" cy="164" r="8"/>
      <circle cx="358" cy="164" r="8"/>
      <circle cx="154" cy="368" r="8"/>
      <circle cx="358" cy="368" r="8"/>
    </g>

    <!-- center hub -->
    <circle cx="256" cy="266" r="78" fill="url(#hub)"/>
    <circle cx="256" cy="266" r="78" fill="none" stroke="#7A5426" stroke-width="5" opacity="0.6"/>

    <!-- keyhole cut into hub, colored as background so it reads as a hole -->
    <g fill="#0F1820">
      <circle cx="256" cy="246" r="21"/>
      <path d="M 241 258 L 271 258 L 283 312 L 229 312 Z"/>
    </g>

    <!-- subtle highlight arc on door face -->
    <path d="M 150 190 A 150 150 0 0 1 330 158" fill="none" stroke="#FFF3D6" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
  </g>
</svg>
